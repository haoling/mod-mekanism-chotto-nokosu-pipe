name: release
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'jar を付ける Release のタグ（例: v1.0.0）。空なら jar を作るだけ'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run game tests
        run: ./gradlew build runGameTestServer --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: chottonokosu-jar
          path: build/libs/chottonokosu-*.jar
      - name: Attach jar to the release
        if: env.RELEASE_TAG != ''
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" build/libs/chottonokosu-*.jar --clobber
      # Modrinth にも同じ jar を公開する。AutoModpack は jar の SHA-1 を Modrinth と照合し、
      # 一致しない jar を「未検証」として警告するため、GitHub Release と同一の jar を載せる。
      # リポジトリ変数 MODRINTH_ID（プロジェクト ID）とシークレット MODRINTH_TOKEN が未設定なら何もしない。
      - name: Publish to Modrinth
        if: env.RELEASE_TAG != '' && env.MODRINTH_ID != '' && env.MODRINTH_TOKEN != ''
        env:
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/chottonokosu-*.jar
          loaders: neoforge
          game-versions: 1.21.1
          version-type: release
          version: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
